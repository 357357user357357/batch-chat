name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-android:
    name: Rust → libnative_rust.so (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/my-rust-module/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/my-rust-module/rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build .so via cargo-ndk (API 21)
        run: cargo ndk -t arm64-v8a -P 21 -o ../android/src/main/jniLibs build --release

  android-apk:
    name: Android APK (assembleRelease) + GitHub Release
    needs: rust-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      # Release build embeds the JS bundle (unlike debug, it does not need a
      # Metro server), so the APK works as a standalone install.
      - name: Gradle assembleRelease (arm64-v8a)
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk batch-chat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-chat-release-apk
          path: batch-chat.apk

      # Publishes to https://github.com/357357user357357/batch-chat/releases
      # (creates the release on first push, then keeps it up to date).
      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 batch-chat.apk \
            --target "${{ github.sha }}" \
            --title "Batch Chat ${{ github.sha }}" \
            --notes "Latest Android build (standalone APK, arm64-v8a). Install: download and open on the phone." \
          || gh release upload v1.0.0 batch-chat.apk --clobber